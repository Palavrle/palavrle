<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palavrle</title>
<meta name="description" content="Adivinha a palavra de cinco letras. Cinco jogos por dia, em português de Portugal.">
<meta name="theme-color" content="#538d4e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palavrle">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@700&display=swap">
<style>
/* Layout: one-screen app — header / mode bar / board area (flex fill, 1, 2 or 4 boards) / keyboard pinned to the bottom */
:root{
  --bg:#ffffff; --fg:#1a1a1b; --muted:#6b6f72; --line:#d3d6da; --line-strong:#878a8c;
  --correct:#6aaa64; --present:#c9b458; --absent:#787c7e; --on-color:#ffffff;
  --cb-correct:#f5793a; --cb-present:#85c0f9;
  --key:#d3d6da; --key-fg:#1a1a1b; --overlay:rgba(255,255,255,.6); --card:#ffffff; --shadow:rgba(0,0,0,.18);
  --toast-bg:#1a1a1b; --toast-fg:#ffffff; --wa:#1f9d55; --err:#b3261e; --hl:#eef5ec; --soft:#f3f4f5;
  --f-ui:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --f-title:"Zilla Slab",Georgia,"Times New Roman",serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121213; --fg:#f8f8f8; --muted:#9a9c9e; --line:#3a3a3c; --line-strong:#565758;
  --correct:#538d4e; --present:#b59f3b; --absent:#3a3a3c; --on-color:#ffffff;
  --cb-correct:#f5793a; --cb-present:#85c0f9;
  --key:#818384; --key-fg:#ffffff; --overlay:rgba(0,0,0,.55); --card:#121213; --shadow:rgba(0,0,0,.6);
  --toast-bg:#f8f8f8; --toast-fg:#121213; --wa:#1f9d55; --err:#ff8a7a; --hl:#1f2a1e; --soft:#1d1d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121213; --fg:#f8f8f8; --muted:#9a9c9e; --line:#3a3a3c; --line-strong:#565758;
  --correct:#538d4e; --present:#b59f3b; --absent:#3a3a3c; --on-color:#ffffff;
  --cb-correct:#f5793a; --cb-present:#85c0f9;
  --key:#818384; --key-fg:#ffffff; --overlay:rgba(0,0,0,.55); --card:#121213; --shadow:rgba(0,0,0,.6);
  --toast-bg:#f8f8f8; --toast-fg:#121213; --wa:#1f9d55; --err:#ff8a7a; --hl:#1f2a1e; --soft:#1d1d1f; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{--tc:var(--correct);--tp:var(--present);background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0;overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
body.cb{--tc:var(--cb-correct);--tp:var(--cb-present)}

#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;border-bottom:1px solid var(--line);flex:none}
header h1{margin:0;font-family:var(--f-title);font-weight:700;font-size:28px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.hbtns{display:flex;gap:2px}
.hbtns.right{justify-content:flex-end}
.icon-btn{background:none;border:0;color:var(--fg);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:6px;padding:0}
.icon-btn svg{width:24px;height:24px}
:is(.icon-btn,.key,.pick,.btn,.tab,.menu-item,.linkbtn,.switch):focus-visible{outline:2px solid var(--tp);outline-offset:2px}

#bar{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 0 0;flex:none;min-height:38px;flex-wrap:wrap}
#bar .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line-strong);border-radius:999px;padding:3px 8px;color:var(--fg)}
.chip.warn{border-color:var(--tp);color:var(--fg)}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;min-width:64px;text-align:center}
.timer.low{color:var(--err)}
.score{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.pick{width:32px;height:32px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:700 14px var(--f-ui);cursor:pointer;border-radius:4px;padding:0}
.pick.on{border-color:var(--fg)}
.pick.won{background:var(--tc);border-color:var(--tc);color:var(--on-color)}
.pick.lost{background:var(--absent);border-color:var(--absent);color:var(--on-color)}
.pick.won.on,.pick.lost.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.btn.small{height:32px;font-size:13px;padding:0 12px}

#boardWrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 0;overflow:hidden}
#boards{display:grid;gap:var(--bgap,12px);grid-template-columns:repeat(var(--bcols,1),auto)}
.board{display:grid;gap:var(--g,5px);grid-template-rows:repeat(var(--rows,6),var(--t,62px));position:relative}
.board.solved{opacity:.92}
.row{display:grid;grid-template-columns:repeat(5,var(--t,62px));gap:var(--g,5px)}
.tile{display:flex;align-items:center;justify-content:center;border:2px solid var(--line);font-weight:700;
  font-size:calc(var(--t,62px)*.52);text-transform:uppercase;line-height:1;user-select:none;box-sizing:border-box}
.tile.filled{border-color:var(--line-strong);animation:pop .1s ease-out}
.tile.active{cursor:pointer}
.tile.cursor{border-color:var(--line-strong);box-shadow:inset 0 -4px 0 var(--fg)}
.tile.correct,.tile.present,.tile.absent{color:var(--on-color);border-color:transparent}
.tile.correct{background:var(--tc)} .tile.present{background:var(--tp)} .tile.absent{background:var(--absent)}
.tile.flip-in{animation:flipIn .25s ease-in forwards}
.tile.flip-out{animation:flipOut .25s ease-out forwards}
.row.shake{animation:shake .5s}
.tile.bounce{animation:bounce .9s}
.flash{animation:flash .6s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes flipIn{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes flipOut{from{transform:rotateX(-90deg)}to{transform:rotateX(0)}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-30px)}50%{transform:translateY(5px)}60%{transform:translateY(-15px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
@keyframes flash{0%{opacity:.3}100%{opacity:1}}
@media (prefers-reduced-motion:reduce){.tile,.row,.tile.filled,.flash{animation:none!important}}

#keyboard{flex:none;padding:0 0 max(8px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:7px;user-select:none}
.krow{display:grid;grid-template-columns:repeat(20,1fr);gap:6px}
.key{grid-column:span 2;height:56px;border:0;border-radius:4px;background:var(--key);color:var(--key-fg);
  font:700 14px var(--f-ui);text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.key.wide{grid-column:span 3;font-size:12px}
.key svg{width:22px;height:22px}
.spacer{grid-column:span 2}
.key.correct{background:var(--tc);color:var(--on-color)}
.key.present{background:var(--tp);color:var(--on-color)}
.key.absent{background:var(--absent);color:var(--on-color)}
.key.multi{color:var(--on-color);text-shadow:0 0 3px rgba(0,0,0,.55)}
@media (max-height:640px){.key{height:48px}}
body[data-boards="4"] .key,body[data-boards="2"] .key{height:46px}
@media (max-height:560px){.key{height:42px}}

#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 96px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50;padding:0 16px}
.toast{background:var(--toast-bg);color:var(--toast-fg);font-weight:700;font-size:14px;padding:12px 16px;border-radius:4px;transition:opacity .3s;display:flex;align-items:center;gap:12px;max-width:100%}
.toast button{pointer-events:auto;background:none;border:1px solid var(--toast-fg);color:var(--toast-fg);border-radius:4px;font:700 13px var(--f-ui);padding:5px 10px;cursor:pointer}

.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--fg);border-radius:8px;box-shadow:0 4px 23px var(--shadow);width:100%;max-width:480px;
  max-height:100%;overflow-y:auto;padding:16px 20px 24px;box-sizing:border-box;position:relative;border:1px solid var(--line)}
.modal .close{position:absolute;top:8px;right:8px}
.modal h2{font-family:var(--f-title);font-size:26px;margin:8px 40px 4px 0;text-wrap:balance}
.modal h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;text-align:center}
.modal h4{font-size:15px;margin:16px 0 4px}
.modal p,.modal li{font-size:15px;line-height:1.45}
.modal ul{padding-left:20px;margin:8px 0}
.ex{display:flex;gap:4px;margin:10px 0 4px}
.ex .tile{width:36px;height:36px;font-size:20px;animation:none}
.ex .tile.plain{border-color:var(--line-strong)}

/* home screen */
#home{flex:1 1 auto;overflow-y:auto;padding:14px 0 calc(env(safe-area-inset-bottom,0px) + 20px)}
body.at-home #bar,body.at-home #boardWrap,body.at-home #keyboard{display:none}
.home-in{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hello{margin:0;font-size:15px;color:var(--muted)}
.hello b{color:var(--fg)}
.mcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;font-family:var(--f-ui);box-sizing:border-box}
.mcard:hover{border-color:var(--line-strong)}
.mcard:focus-visible{outline:2px solid var(--tp);outline-offset:2px}
.mcard b{display:block;font-size:16px}
.mcard small{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.mcard .ico{width:40px;height:40px;flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:3px}
.mcard .ico i{background:var(--absent);border-radius:3px}
.mcard .ico i.c{background:var(--tc)} .mcard .ico i.p{background:var(--tp)}
.mcard.main{border:2px solid var(--tc);padding:18px 16px;flex-direction:column;align-items:stretch;gap:12px}
.mcard.main .top{display:flex;align-items:center;gap:14px}
.mcard.main b{font-family:var(--f-title);font-size:26px;letter-spacing:.02em}
.mcard .go{margin-left:auto;font-size:22px;color:var(--muted)}
.dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.dots i{width:26px;height:26px;border-radius:4px;border:2px solid var(--line);box-sizing:border-box;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700}
.dots i.won{background:var(--tc);border-color:var(--tc);color:var(--on-color)}
.dots i.lost{background:var(--absent);border-color:var(--absent);color:var(--on-color)}
.dots i.part{border-color:var(--line-strong)}
.dots span{font-size:13px;color:var(--muted);margin-left:6px}
.msec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 -2px}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mgrid .mcard{flex-direction:column;align-items:flex-start;gap:10px}
.mgrid .mcard .ico{width:32px;height:32px}
.mgrid .mcard.wide{grid-column:span 2;flex-direction:row;align-items:center}
.mlinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.mlinks .btn{width:100%}
@media (max-width:360px){.mgrid{grid-template-columns:1fr}.mgrid .mcard.wide{grid-column:auto}}

/* side menu */
#menu{position:fixed;inset:0;z-index:25;background:var(--overlay)}
#menu .panel{position:absolute;top:0;bottom:0;left:0;width:min(300px,86vw);background:var(--card);border-right:1px solid var(--line);
  box-shadow:4px 0 20px var(--shadow);overflow-y:auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 12px calc(env(safe-area-inset-bottom,0px) + 16px) max(12px,env(safe-area-inset-left,0px));box-sizing:border-box}
.menu-title{font-family:var(--f-title);font-size:24px;text-transform:uppercase;letter-spacing:.06em;padding:4px 8px 12px}
.menu-sec{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--fg);font:600 15px var(--f-ui);text-align:left;padding:11px 8px;border-radius:6px;cursor:pointer}
.menu-item:hover{background:var(--soft)}
.menu-item.on{background:var(--hl)}
.menu-item small{display:block;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.menu-item .ico{width:28px;height:28px;flex:none;display:grid;grid-template-columns:repeat(2,1fr);gap:2px}
.menu-item .ico i{background:var(--absent);border-radius:2px}
.menu-item .ico i.c{background:var(--tc)} .menu-item .ico i.p{background:var(--tp)}

/* gate */
#gate{position:fixed;inset:0;background:var(--bg);z-index:40;overflow-y:auto;display:flex;justify-content:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.gate-in{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;margin:auto 0}
.gate-in h1{font-family:var(--f-title);font-size:44px;letter-spacing:.06em;text-transform:uppercase;text-align:center;margin:0}
.gate-tiles{display:flex;justify-content:center;gap:5px}
.gate-tiles .tile{width:40px;height:40px;font-size:22px;animation:none}
.gate-in p{margin:0;text-align:center;line-height:1.45;font-size:15px}
.sub{color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.field input,.inp{height:44px;border:1px solid var(--line-strong);border-radius:6px;background:var(--bg);color:var(--fg);font:16px var(--f-ui);padding:0 12px;box-sizing:border-box;min-width:0}
.field input:focus,.inp:focus{outline:2px solid var(--tp);outline-offset:0}
.btn{border:0;border-radius:24px;height:44px;padding:0 18px;font:700 15px var(--f-ui);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--tc);color:var(--on-color)}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line-strong)}
.btn.danger{background:none;color:var(--err);border:1px solid var(--err)}
.btn.wa{background:var(--wa);color:var(--on-color)}
.btn.wa svg{width:20px;height:20px}
.btn.google{background:var(--bg);color:var(--fg);border:1px solid var(--line-strong)}
.btn.google svg{width:18px;height:18px}
.btn.full{width:100%}
.btn[disabled]{opacity:.6;cursor:default}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;border:0;color:var(--fg);font:600 14px var(--f-ui);text-decoration:underline;cursor:pointer;padding:4px;align-self:center}
.err{color:var(--err);font-size:14px;text-align:center;min-height:1em;margin:0}
.ok{color:var(--tc);font-size:14px;text-align:center;margin:0;font-weight:700}

/* stats */
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 4px;text-align:center}
.statrow.four{grid-template-columns:repeat(4,1fr)}
.tabs.seg{border-bottom:0;background:var(--soft);border-radius:8px;padding:3px;gap:3px;margin-bottom:4px}
.tabs.seg .tab{border-bottom:0;border-radius:6px;height:34px}
.tabs.seg .tab.on{background:var(--card);box-shadow:0 1px 3px var(--shadow)}
.stat b{display:block;font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;line-height:1.2;display:block}
.dist{display:flex;flex-direction:column;gap:4px;max-width:340px;margin:0 auto}
.drow{display:flex;align-items:center;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.drow i{font-style:normal;width:10px;text-align:right}
.bar{background:var(--absent);color:var(--on-color);font-weight:700;padding:2px 8px;text-align:right;min-width:24px;box-sizing:border-box}
.bar.hl{background:var(--tc)}
.today{display:flex;justify-content:center;gap:8px}
.today .pick{cursor:pointer}
.foot{display:flex;align-items:center;gap:16px;margin-top:20px}
.foot .next{flex:1;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.foot .next small{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.foot .next b{font-size:28px;font-weight:500;font-variant-numeric:tabular-nums}
.foot .acts{flex:1;display:flex;flex-direction:column;gap:8px}
.share{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.share .btn{flex:1 1 110px}
.alldone{font-weight:700;text-align:center;font-size:15px}
.result{text-align:center;margin:6px 0 0}
.result .word{display:inline-block;font-weight:800;letter-spacing:.12em;font-size:22px;margin-top:4px}
.result .others{margin-top:10px;font-size:14px;color:var(--muted)}
.center{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.copybox{width:100%;height:120px;margin-top:10px;font:14px/1.3 var(--f-ui);background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.loading{text-align:center;color:var(--muted);padding:30px 0}
.empty{text-align:center;color:var(--muted);padding:24px 0;font-size:15px}
.prof-head{text-align:center}
.prof-head h2{margin-right:0}
.prof-head small{color:var(--muted);font-size:13px}
.recent{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.rday{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rday b{width:100%;aspect-ratio:1;max-width:44px;border-radius:4px;display:grid;place-items:center;font-size:14px;color:var(--on-color);background:var(--line)}
.rday b.l1{background:var(--tp)} .rday b.l2{background:var(--tc)} .rday b.l0{background:var(--absent)}
.rday b.none{color:var(--muted);background:none;border:1px dashed var(--line-strong);box-sizing:border-box}
.prof-actions{display:flex;justify-content:center;gap:8px;margin-top:18px;flex-wrap:wrap}

/* achievements */
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.badge .medal{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--line);color:var(--muted)}
.badge.ok .medal{background:var(--tc);color:var(--on-color)}
.badge b{display:block;font-size:13px}
.badge span{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.badge:not(.ok){opacity:.7}

/* mini grids */
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px 8px}
.mini{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.mini .g{display:grid;grid-template-columns:repeat(5,12px);gap:2px}
.mini .g i{width:12px;height:12px;border-radius:2px;background:var(--absent)}
.mini .g i.correct{background:var(--tc)} .mini .g i.present{background:var(--tp)} .mini .g i.absent{background:var(--absent)}
.mini .nm{font-size:12px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;color:var(--fg);cursor:pointer;padding:0;font-family:var(--f-ui)}
.mini .sc{font-size:11px;color:var(--muted)}
.mini.me .nm{text-decoration:underline}
.hday{border-top:1px solid var(--line);padding:12px 0}
.hday h4{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
.hgames{display:flex;flex-wrap:wrap;gap:12px}
.hgame{display:flex;flex-direction:column;gap:4px;align-items:center}
.hgame .w{font-size:11px;font-weight:800;letter-spacing:.08em}

/* ranking */
.tabs{display:flex;border-bottom:1px solid var(--line);margin:6px 0 10px;overflow-x:auto;scrollbar-width:none}
.tab{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:700 13px var(--f-ui);height:40px;cursor:pointer;padding:0 10px}
.tab.on{color:var(--fg);border-bottom-color:var(--tc)}
.lb{display:flex;flex-direction:column}
.lbrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lbrow.me{background:var(--hl)}
.lbrow .pos{font-weight:700;text-align:center;color:var(--muted)}
.lbrow .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;color:var(--fg);font-size:15px;text-align:left;cursor:pointer;padding:0;font-family:var(--f-ui)}
.lbrow .wl{font-size:13px;color:var(--muted);text-align:right}
.lbrow .pts{font-weight:800;min-width:44px;text-align:right}
.lbhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--line-strong)}
.lbhead .nm{font-weight:600;font-size:11px;cursor:default}
.lbmine{margin-top:10px;border-top:2px solid var(--line-strong)}

/* settings */
.setting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.setting b{display:block;font-size:15px}
.setting span{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.35}
.switch{width:46px;height:28px;border-radius:14px;border:0;background:var(--line-strong);position:relative;cursor:pointer;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--bg);transition:left .15s}
.switch[aria-checked="true"]{background:var(--tc)}
.switch[aria-checked="true"]::after{left:21px}

/* archive + admin */
.days{display:flex;flex-direction:column}
.dayrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 6px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;color:var(--fg);font:600 15px var(--f-ui);cursor:pointer;text-align:left;width:100%}
.dayrow span{color:var(--muted);font-weight:400;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.kpis b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpis span{font-size:11px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;border-bottom:1px solid var(--line-strong);padding-top:14px}
.bars div{flex:1;background:var(--tc);border-radius:2px 2px 0 0;position:relative;min-height:2px}
.bars div span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.barlbl{display:flex;gap:4px}
.barlbl span{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;border-bottom:1px solid var(--line-strong);padding:6px 4px}
.tbl td{border-bottom:1px solid var(--line);padding:8px 4px}
.tblwrap{overflow-x:auto}
.sugg{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sugg .inp{width:110px;height:36px;text-transform:uppercase;font-weight:700}
.sugg small{color:var(--muted);flex:1 1 100px}
.row2{display:flex;gap:8px}
.row2 .inp{flex:1}
</style>
</head>

function errMsg(e){
  const m = (e && (e.message || e.error_description || e.msg)) || "";
  if (/Invalid login credentials/i.test(m)) return "Email ou palavra-passe errados.";
  if (/already registered|already been registered|already exists/i.test(m)) return "Já existe uma conta com este email. Entra em vez de criar conta.";
  if (/Password should be at least|password.*(short|characters)/i.test(m)) return "A palavra-passe tem de ter pelo menos 6 caracteres.";
  if (/valid email|invalid.*email|email.*invalid/i.test(m)) return "Esse email não parece válido.";
  if (/Email not confirmed/i.test(m)) return "Confirma o teu email antes de entrar (vê a tua caixa de correio).";
  if (/rate limit|too many/i.test(m)) return "Demasiadas tentativas. Espera uns minutos e tenta outra vez.";
  if (/username_taken/.test(m)) return "Esse nome já está a ser usado. Escolhe outro.";
  if (/invalid_username/.test(m)) return "Usa 3 a 20 caracteres: letras sem acentos, números, ponto, hífen ou _.";
  if (/not_admin/.test(m)) return "Só o administrador pode ver isto.";
  if (/not_finished/.test(m)) return "Termina o jogo primeiro para veres como os outros jogaram.";
  if (/display_mismatch/.test(m)) return "A grafia não corresponde à palavra sugerida.";
  if (/Failed to fetch|NetworkError|network|Load failed/i.test(m)) return "Sem ligação à internet. Tenta outra vez.";
  return "Algo correu mal. Tenta outra vez.";
}

function letterStates(rows){
  const rank = { absent: 1, present: 2, correct: 3 }, st = {};
  rows.forEach(r => { const n = norm(r.word); r.colors.forEach((v, i) => { const l = n[i]; if (!st[l] || rank[v] > rank[st[l]]) st[l] = v; }); });
  return st;
}
function renderKeyboard(){

  if (!v) return;
  if (v.boards.length === 1){
    const st = letterStates(v.boards[0].rows);
    kb.querySelectorAll(".key").forEach(b => { if (st[b.dataset.key]) b.classList.add(st[b.dataset.key]); });
    return;
  }
  const per = v.boards.map(b => b.solved ? null : letterStates(b.rows));
  const col = s => s === "correct" ? "var(--tc)" : s === "present" ? "var(--tp)" : s === "absent" ? "var(--absent)" : "var(--key)";
  kb.querySelectorAll(".key").forEach(b => {
    const k = b.dataset.key; if (k.length !== 1) return;
    const cs = per.map(st => st ? (st[k] || null) : "solved");
    const open = cs.filter(c => c !== "solved");
    if (open.every(c => !c)) return;
    if (open.every(c => c === "absent")){ b.classList.add("absent"); return; }
    b.classList.add("multi");

    else b.style.background = `linear-gradient(to right, ${col(cs[0])} 50%, ${col(cs[1])} 50%) top/100% 50% no-repeat, linear-gradient(to right, ${col(cs[2])} 50%, ${col(cs[3])} 50%) bottom/100% 50% no-repeat`;

function fit(){

  const t = Math.max(14, Math.min(n === 1 ? 62 : 44, tw, th));

async function setMode(m, opts){
  if (busy) return;
  closeModals(); closeMenu();

  if (m === "archive"){ showArchive(); return; }

  prac = null; builtShape = ""; renderAll();
  if (m === "timed"){ showTimedIntro(); return; }
  try{

  }catch(e){ toast(errMsg(e)); }
}

function stopTimed(){ clearInterval(timedTick); timedTick = null; }
function showTimedIntro(){
  openModal(`<h2>Contra-relógio</h2>

    <ul><li><b>+90 segundos</b> se acertares em 1 a 3 tentativas</li><li><b>+60 segundos</b> em 4 ou 5 tentativas</li><li><b>+30 segundos</b> à 6.ª tentativa</li></ul>
    <p>Cada palavra vale pontos como no jogo do dia: 6 à 1.ª tentativa, 5 à 2.ª … 1 à 6.ª.</p>
    <p>Não dá para saltar palavras. O jogo acaba quando o tempo chega a zero <b>ou quando falhas uma palavra</b>.</p>
    <p>Tem um ranking próprio com o teu melhor jogo. Em caso de empate, ganha quem usou menos tentativas.</p>
    <div class="center"><button class="btn primary" id="tGo" type="button">Começar</button></div>`);
  $("#tGo").onclick = startTimed;
}
async function startTimed(){
  if (busy) return;
  try{
    prac = await rpc("practice_start", { p_mode: "timed" });
    pracEnds = Date.now() + prac.seconds_left * 1000; timedEnding = false;
    resetCur(); builtShape = ""; closeModals(); renderAll();
    stopTimed(); timedTick = setInterval(tickTimed, 250);
  }catch(e){ toast(errMsg(e)); }
}
function tickTimed(){
  if (!prac || prac.status !== "playing"){ stopTimed(); return; }
  const left = Math.max(0, Math.ceil((pracEnds - Date.now()) / 1000));
  const t = $("#timer"); if (t){ t.textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`; t.classList.toggle("low", left <= 20); }
  if (left <= 0 && !timedEnding && !busy) endTimed();
}
async function endTimed(reason){
  timedEnding = true; stopTimed();
  let r;
  try{ r = await rpc("practice_finish", { p_id: prac.id }); }catch(e){ r = Object.assign({}, prac, { status: "done", best: prac.points }); }
  if (reason !== "fail" && r.status === "playing" && r.seconds_left > 1){
    // the server still has time left: keep playing with the server's clock
    prac = r; pracEnds = Date.now() + r.seconds_left * 1000; timedEnding = false;
    renderAll(); timedTick = setInterval(tickTimed, 250); return;
  }
  if (r.status === "playing") r = Object.assign({}, r, { status: "done" });
  prac = r; resetCur(); renderAll();
  const ans = r.boards && r.boards[0] && r.boards[0].answer;
  const record = r.points > 0 && r.points >= r.best;
  openModal(`<h2>${reason === "fail" ? "Falhaste a palavra!" : "Tempo!"}</h2>
    <div class="result"><span class="word" style="font-size:44px">${r.points || 0}</span><br>pontos${record ? " · novo recorde!" : ""}</div>
    <p class="note" style="font-size:14px">${r.score} ${r.score === 1 ? "palavra acertada" : "palavras acertadas"} · ${r.attempts || 0} ${r.attempts === 1 ? "tentativa" : "tentativas"}</p>
    ${ans ? `<div class="result" style="margin-top:14px">${reason === "fail" ? "A palavra era" : "A última palavra era"}<br><span class="word">${esc(ans)}</span></div>` : ""}
    <p class="note">O teu melhor jogo: <b>${r.best}</b> pontos (${r.best_words || 0} ${r.best_words === 1 ? "palavra" : "palavras"})</p>
    <div class="center"><button class="btn primary" id="tAgain" type="button">Jogar outra vez</button><button class="btn ghost" id="tRank" type="button">Ranking</button><button class="btn ghost" id="tHome" type="button">Início</button></div>`);
  $("#tHome").onclick = showHome;
  $("#tAgain").onclick = startTimed;
  $("#tRank").onclick = () => showRanking("timed");
}

/* profile */
function statsBlock(p){
  const pct = p.played ? Math.round(100 * p.wins / p.played) : 0, max = Math.max(1, ...p.dist);
  const avg = p.wins ? (p.dist.reduce((a, v, i) => a + v * (i + 1), 0) / p.wins).toFixed(1).replace(".", ",") : "–";
  const today = daily ? daily.today : 0;
  return `<div class="statrow">
      <div class="stat"><b>${p.played}</b><span>Jogados</span></div>
      <div class="stat"><b>${pct}</b><span>% Vitórias</span></div>
      <div class="stat"><b>${p.points}</b><span>Pontos</span></div>
      <div class="stat"><b>${p.cur_win}</b><span>Vitórias seguidas (máx. ${p.max_win})</span></div>
      <div class="stat"><b>${p.cur_days}</b><span>Dias seguidos (máx. ${p.max_days})</span></div>
      <div class="stat"><b>${avg}</b><span>Média de tentativas</span></div>
    </div>
    <h3>Distribuição de tentativas</h3>
    <div class="dist">${p.dist.map((v, i) => `<div class="drow"><i>${i + 1}</i><div class="bar" style="width:${Math.max(7, Math.round(100 * v / max))}%">${v}</div></div>`).join("")}</div>
    <h3>Últimos 7 dias</h3>
    <div class="recent">${Array.from({ length: 7 }, (_, k) => {
      const d = today - 6 + k, r = p.recent.find(x => x.day === d);
      const lbl = d === today ? "Hoje" : dayDate(d, { day: "numeric", month: "short" }).replace(".", "");
      if (d < 0) return `<div class="rday"><b class="none">·</b>&nbsp;</div>`;
      if (!r) return `<div class="rday"><b class="none">0</b>${esc(lbl)}</div>`;
      const lvl = r.wins === 0 ? "l0" : r.wins === r.played ? "l2" : "l1";
      return `<div class="rday" title="${r.wins}/${r.played} ganhos"><b class="${lvl}">${r.points}</b>${esc(lbl)}</div>`;
    }).join("")}</div>
    <p class="note">Cada quadrado mostra os pontos desse dia.</p>
    <div class="statrow" style="margin-top:10px">
      <div class="stat"><b>${p.hard_wins}</b><span>Vitórias em modo difícil</span></div>
      <div class="stat"><b>${p.practice_wins}</b><span>Treinos ganhos</span></div>
      <div class="stat"><b>${p.timed_best}</b><span>Melhor contra-relógio (pontos)</span></div>
    </div>`;
}
function speedBlock(sp){
  if (!sp || !sp.count) return `<h3>Tempos</h3><p class="empty" style="padding:8px 0">Ainda sem vitórias cronometradas.</p>`;
  const ws = sp.weeks.slice(-8), mx = Math.max(1, ...ws.map(w => w.avg));

    <div class="statrow">
      <div class="stat"><b>${fmtT(sp.avg)}</b><span>Tempo médio por vitória</span></div>
      <div class="stat"><b>${fmtT(sp.best)}</b><span>Vitória mais rápida</span></div>
      <div class="stat"><b>${sp.count}</b><span>Vitórias cronometradas</span></div>

    : per === "day" ? "Ainda ninguém terminou um jogo hoje. Sê o primeiro!" : "Ainda não há resultados.";

/* ---------- input ---------- */
function activeRowEls(){
  const v = view(); if (!v) return [];
  return [...boardsEl.children].map((el, bi) => (!v.boards[bi].solved && el.children[v.boards[bi].rows.length]) || null).filter(Boolean);
}
function shake(){ activeRowEls().forEach(r => { r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake"); setTimeout(() => r.classList.remove("shake"), 520); }); }
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

function hardMsg(rows, guess){
  const need = {};
  for (const r of rows){
    const w = norm(r.word), cnt = {};
    for (let i = 0; i < LEN; i++){
      if (r.colors[i] === "correct" && guess[i] !== w[i]) return `A ${i + 1}.ª letra tem de ser ${w[i]}`;
      if (r.colors[i] !== "absent") cnt[w[i]] = (cnt[w[i]] || 0) + 1;
    }
    for (const k in cnt) need[k] = Math.max(need[k] || 0, cnt[k]);
  }
  for (const k in need){ if ([...guess].filter(c => c === k).length < need[k]) return `A tentativa tem de ter a letra ${k}`; }
  return null;
}

function press(k){
  if (!started || busy || anyOverlay() || atHome()) return;
  const v = view(); if (!v || !v.playing) return;
  if (mode === "timed" && (!prac || prac.status !== "playing")) return;
  if (k === "BACK"){ if (cur[pos]) cur[pos] = ""; else if (pos > 0){ pos--; cur[pos] = ""; } renderBoards(); return; }
  if (k === "LEFT"){ if (pos > 0) pos--; renderBoards(); return; }
  if (k === "RIGHT"){ if (pos < LEN - 1) pos++; renderBoards(); return; }
  if (k === "ENTER"){ submit(); return; }
  if (/^[A-Z]$/.test(k) && !"KWY".includes(k)){
    cur[pos] = k;
    let nx = -1; for (let i = pos + 1; i < LEN; i++) if (!cur[i]){ nx = i; break; }
    pos = nx >= 0 ? nx : Math.min(pos + 1, LEN - 1);
    renderBoards();
  }
}
function rejectWord(word){
  shake();
  toast("Palavra não aceite", 1600, { label: "Sugerir", fn: async () => {
    try{ const r = await rpc("suggest_word", { p_word: word }); toast(r.status === "exists" ? "Essa palavra já foi aceite. Recarrega a página." : "Obrigado! Vamos analisar a sugestão."); }
    catch(e){ toast(errMsg(e)); }
  } });
}
function animateRows(rowEls, evs, words, done){
  const step = reduced() ? 0 : 280;
  rowEls.forEach((rowEl, bi) => {
    const tiles = [...rowEl.children], ev = evs[bi], shown = [...words[bi]];
    tiles.forEach((t, i) => setTimeout(() => {
      if (!step){ t.className = "tile " + ev[i]; t.textContent = shown[i]; return; }
      t.classList.add("flip-in");
      setTimeout(() => { t.className = "tile flip-out " + ev[i]; t.textContent = shown[i]; }, 250);
    }, i * step));
  });
  setTimeout(done, LEN * step + (step ? 300 : 0));
}
async function submit(){
  const v = view();
  if (cur.some(c => !c)){ toast("Faltam letras"); shake(); return; }
  const word = cur.join("");
  if (!DICT.has(word)){ rejectWord(word); return; }
  if (isDayMode() && hardActive()){
    const msg = hardMsg(curGame().rows, word); if (msg){ toast(msg); shake(); return; }
  }
  const rowEls = activeRowEls();
  busy = true; renderBoards();
  try{
    if (isDayMode()) await submitDay(word, rowEls);
    else await submitPractice(word, rowEls);
  }catch(e){
    busy = false;
    const m = (e && e.message) || "";
    if (/invalid_word/.test(m)){ renderBoards(); rejectWord(word); return; }
    if (/hard_mode: /.test(m)){ toast(m.replace(/^.*hard_mode: /, "")); shake(); renderBoards(); return; }
    if (/game_over/.test(m)){ if (isDayMode()) await reloadDayMode(); renderAll(); return; }
    if (/not_authenticated|JWT/i.test(m)){ toast("A tua sessão terminou. Entra outra vez."); logout(); return; }
    toast(errMsg(e)); renderBoards();
  }
}
async function reloadDayMode(){
  if (mode === "archive") archive = await rpc("get_day", { p_day: archive.day });
  else await loadDaily();
}
async function submitDay(word, rowEls){
  const isArch = mode === "archive", d = dayData(), s = curSlot(), g = d.games[s];
  const res = await rpc("play_guess", { p_slot: s, p_guess: word, p_day: isArch ? d.day : null, p_hard: g.rows.length ? !!g.hard : !!me.hard_mode });
  if (!isArch && res.day !== d.day){ toast("Começou um dia novo!"); await loadDaily(); slot = firstOpen(daily.games); resetCur(); busy = false; renderAll(); return; }
  d.games[s] = { slot: s, status: res.status, rows: res.rows, answer: res.answer, hard: res.hard, archive: res.archive, seconds: res.seconds };
  resetCur();
  const last = res.rows[res.rows.length - 1];
  const won = res.status === "won", lost = res.status === "lost";
  animateRows(rowEls, [last.colors], [last.word], () => {
    busy = false; renderBar(); renderKeyboard(); if (!won && !lost) renderBoards();
    if (won){
      toast(["Génio!", "Magnífico!", "Impressionante!", "Esplêndido!", "Boa!", "Ufa!"][res.rows.length - 1], 1800);
      if (!reduced()) [...rowEls[0].children].forEach((t, i) => setTimeout(() => t.classList.add("bounce"), i * 100));
    } else if (lost) toast(res.answer || "", 2200);
    if (won || lost){
      setTimeout(() => {
        if (mode === "daily" && !isArch) showDayResult();
        else if (mode === "archive"){ const nx = archive.games.findIndex(x => x.status === "playing"); if (nx >= 0){ archSlot = nx; resetCur(); renderAll(); } else toast("Terminaste este dia do arquivo", 2500); }
      }, won ? 1900 : 2300);
    }
  });
}
async function submitPractice(word, rowEls){
  const before = prac;
  const res = await rpc("practice_guess", { p_id: before.id, p_guess: word });
  if (res.time_over){ prac = res; busy = false; endTimed(); return; }
  resetCur();
  if (prac.mode === "timed"){
    const last = res.last;
    if (last){
      const lr = last.rows[last.rows.length - 1];
      animateRows(rowEls, [lr.colors], [lr.word], () => {
        busy = false;
        if (!last.solved){ prac = res; setTimeout(() => endTimed("fail"), 700); return; }
        prac = res; builtShape = "";
        pracEnds = Date.now() + res.seconds_left * 1000;
        toast(`✓ ${last.answer} · +${last.points} pts · +${last.bonus}s`, 1600);
        renderAll(); boardsEl.classList.remove("flash"); void boardsEl.offsetWidth; boardsEl.classList.add("flash");
        if (Date.now() >= pracEnds) endTimed();
      });
      return;
    }
  }
  const evs = [], words = [];
  const targets = [];
  before.boards.forEach((b, bi) => { if (!b.solved){ const rr = res.boards[bi].rows; const lr = rr[rr.length - 1]; evs.push(lr.colors); words.push(lr.word); targets.push(bi); } });
  animateRows(rowEls, evs, words, () => {
    prac = res; busy = false; renderAll();
    if (prac.mode === "timed"){ if (res.seconds_left != null) pracEnds = Date.now() + res.seconds_left * 1000; if (Date.now() >= pracEnds) endTimed(); return; }
    if (res.status === "won" || res.status === "lost") setTimeout(showPracticeEnd, res.status === "won" ? 900 : 1300);
  });
}
function showPracticeEnd(){
  const p = prac, won = p.status === "won";
  const words = p.boards.map(b => b.answer).filter(Boolean);
  const sq = sqMap();
  const grid = p.boards.length === 1 ? p.boards[0].rows.map(r => r.colors.map(c => sq[c]).join("")).join("\n") : p.boards.map((b, i) => `${b.solved ? "✅" : "❌"} ${b.rows.length}/${p.max}`).join("  ");
  const txt = `Palavrle · ${MODES[p.mode].name} · ${won ? (p.boards.length === 1 ? p.boards[0].rows.length + "/6" : p.guesses + "/" + p.max) : "X"}\n\n${grid}\n\n${siteUrl()}`;
  const m = openModal(`<h2>${won ? "Acertaste!" : "Desta vez não deu"}</h2>
    <div class="result">${p.boards.length > 1 ? "As palavras eram" : "A palavra era"}<br><span class="word">${words.map(esc).join(" · ")}</span></div>
    <div class="center"><button class="btn primary" id="pAgain" type="button">Jogar outra vez</button><button class="btn ghost" id="pDaily" type="button">Início</button></div>
    <h3>Partilhar</h3>${shareButtons(txt)}`);
  wireShare(m, txt);
  $("#pAgain").onclick = newPractice;
  $("#pDaily").onclick = showHome;
}

document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeModals(); closeMenu(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  if (e.key === "Enter"){
    const a = document.activeElement;
    if (a && a.tagName === "BUTTON" && anyOverlay()) return;
    if (a && a.tagName === "BUTTON") a.blur();
    e.preventDefault(); press("ENTER"); return;
  }
  if (e.key === "Backspace" || e.key === "Delete"){ e.preventDefault(); press("BACK"); return; }
  if (e.key === "ArrowLeft"){ e.preventDefault(); press("LEFT"); return; }
  if (e.key === "ArrowRight"){ e.preventDefault(); press("RIGHT"); return; }
  if (e.key.length === 1){ const k = norm(e.key); if (/^[A-Z]$/.test(k)) press(k); }
});
boardsEl.addEventListener("click", e => {
  const t = e.target.closest(".tile.active"); if (!t || busy) return;
  pos = +t.dataset.i; renderBoards();
});
$("#menuBtn").onclick = showHome;
$("#helpBtn").onclick = showHelp;
$("#rankBtn").onclick = () => showRanking();
$("#profBtn").onclick = () => showProfile();
$("#homeTitle").onclick = showHome;
addEventListener("resize", fit);
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; });

/* new day: refresh when the countdown ends or when the app comes back */
async function refreshDay(){
  if (!started || busy) return;
  try{
    const old = daily.day; await loadDaily();
    if (daily.day !== old){ if (mode === "daily"){ resetCur(); builtShape = ""; renderAll(); } toast("Há palavras novas!"); }
    if (atHome()) renderHome();
  }catch(e){}
}
setInterval(() => { if (started && secsLeftToday() <= 0) refreshDay(); }, 5000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible" || !started) return;
  refreshDay();
  if (mode === "timed" && prac && prac.status === "playing" && Date.now() >= pracEnds) endTimed();
});

/* ---------- boot ---------- */
if (store.get("palavrle-cb")) document.body.classList.add("cb");
buildKeyboard();
sb.auth.onAuthStateChange((event) => {
  if (event === "PASSWORD_RECOVERY"){ recovering = true; setTimeout(showRecovery, 0); return; }
  if (event === "SIGNED_IN" && !started) setTimeout(afterLogin, 0);
});
afterLogin();
