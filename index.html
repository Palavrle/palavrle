<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}[hidden]{display:none!important}</style>
<title>Palavrle</title>
<meta name="description" content="Adivinha a palavra de cinco letras. Cinco jogos por dia, em português de Portugal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Zilla+Slab:wght@700&display=swap">
<style>
/* Layout: one-screen app, header / game picker / board (flex fill) / keyboard pinned to the bottom, like the original */
:root{
  --bg:#ffffff; --fg:#1a1a1b; --muted:#787c7e; --line:#d3d6da; --line-strong:#878a8c;
  --correct:#6aaa64; --present:#c9b458; --absent:#787c7e; --on-color:#ffffff;
  --key:#d3d6da; --key-fg:#1a1a1b; --overlay:rgba(255,255,255,.55); --card:#ffffff; --shadow:rgba(0,0,0,.18);
  --toast-bg:#1a1a1b; --toast-fg:#ffffff; --wa:#1f9d55;
  --f-ui:"Libre Franklin","Helvetica Neue",Arial,sans-serif;
  --f-title:"Zilla Slab",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121213; --fg:#f8f8f8; --muted:#818384; --line:#3a3a3c; --line-strong:#565758;
  --correct:#538d4e; --present:#b59f3b; --absent:#3a3a3c; --on-color:#ffffff;
  --key:#818384; --key-fg:#ffffff; --overlay:rgba(0,0,0,.5); --card:#121213; --shadow:rgba(0,0,0,.6);
  --toast-bg:#f8f8f8; --toast-fg:#121213; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121213; --fg:#f8f8f8; --muted:#818384; --line:#3a3a3c; --line-strong:#565758;
  --correct:#538d4e; --present:#b59f3b; --absent:#3a3a3c; --on-color:#ffffff;
  --key:#818384; --key-fg:#ffffff; --overlay:rgba(0,0,0,.5); --card:#121213; --shadow:rgba(0,0,0,.6);
  --toast-bg:#f8f8f8; --toast-fg:#121213; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);margin:0;overflow:hidden;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));box-sizing:border-box}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:52px;border-bottom:1px solid var(--line);flex:none}
header h1{margin:0;font-family:var(--f-title);font-weight:700;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
.hbtns{display:flex;gap:4px}
.hbtns.right{justify-content:flex-end}
.icon-btn{background:none;border:0;color:var(--fg);width:40px;height:40px;display:grid;place-items:center;cursor:pointer;border-radius:6px}
.icon-btn:focus-visible,.key:focus-visible,.pick:focus-visible,.btn:focus-visible{outline:2px solid var(--present);outline-offset:2px}
.icon-btn svg{width:24px;height:24px}

#picker{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 0 2px;flex:none}
#picker .lbl{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.pick{width:34px;height:34px;border:2px solid var(--line);background:var(--bg);color:var(--fg);font:700 15px var(--f-ui);cursor:pointer;border-radius:4px;padding:0}
.pick.on{border-color:var(--fg)}
.pick.won{background:var(--correct);border-color:var(--correct);color:var(--on-color)}
.pick.lost{background:var(--absent);border-color:var(--absent);color:var(--on-color)}
.pick.won.on,.pick.lost.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}

#boardWrap{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;padding:8px 0}
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:5px;width:var(--bw,330px);height:calc(var(--bw,330px)*1.2)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tile{display:flex;align-items:center;justify-content:center;border:2px solid var(--line);font-weight:700;
  font-size:calc(var(--bw,330px)*.1);text-transform:uppercase;line-height:1;user-select:none;box-sizing:border-box}
.tile.filled{border-color:var(--line-strong);animation:pop .1s ease-out}
.tile.active{cursor:pointer}
.tile.cursor{border-color:var(--line-strong);box-shadow:inset 0 -5px 0 var(--fg)}
.tile.correct,.tile.present,.tile.absent{color:var(--on-color);border-color:transparent}
.tile.correct{background:var(--correct)} .tile.present{background:var(--present)} .tile.absent{background:var(--absent)}
.tile.flip-in{animation:flipIn .25s ease-in forwards}
.tile.flip-out{animation:flipOut .25s ease-out forwards}
.row.shake{animation:shake .5s}
.tile.bounce{animation:bounce .9s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes flipIn{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes flipOut{from{transform:rotateX(-90deg)}to{transform:rotateX(0)}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@keyframes bounce{0%,20%{transform:translateY(0)}40%{transform:translateY(-30px)}50%{transform:translateY(5px)}60%{transform:translateY(-15px)}80%{transform:translateY(2px)}100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.tile,.row,.tile.filled{animation:none!important}}

#keyboard{flex:none;padding:0 0 max(8px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;user-select:none}
.krow{display:grid;grid-template-columns:repeat(20,1fr);gap:6px}
.key{grid-column:span 2;height:58px;border:0;border-radius:4px;background:var(--key);color:var(--key-fg);
  font:700 14px var(--f-ui);text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.key.wide{grid-column:span 3;font-size:12px}
.key svg{width:22px;height:22px}
.spacer{grid-column:span 2}
.key.correct{background:var(--correct);color:var(--on-color)}
.key.present{background:var(--present);color:var(--on-color)}
.key.absent{background:var(--absent);color:var(--on-color)}
@media (max-height:640px){.key{height:50px}}
@media (max-height:560px){.key{height:44px}#picker{padding-top:6px}}

#toasts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:30}
.toast{background:var(--toast-bg);color:var(--toast-fg);font-weight:700;font-size:14px;padding:12px 16px;border-radius:4px;transition:opacity .3s}

.overlay{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--card);color:var(--fg);border-radius:8px;box-shadow:0 4px 23px var(--shadow);width:100%;max-width:480px;
  max-height:100%;overflow-y:auto;padding:16px 20px 24px;box-sizing:border-box;position:relative;border:1px solid var(--line)}
.modal .close{position:absolute;top:8px;right:8px}
.modal h2{font-family:var(--f-title);font-size:26px;margin:8px 0 4px;text-wrap:balance}
.modal h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;text-align:center}
.modal p,.modal li{font-size:15px;line-height:1.45}
.modal ul{padding-left:20px;margin:8px 0}
.ex{display:flex;gap:4px;margin:10px 0 4px}
.ex .tile{width:38px;height:38px;font-size:22px;animation:none}
.ex .tile.plain{border-color:var(--line-strong)}
.statrow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stat b{display:block;font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;line-height:1.2;display:block}
.dist{display:flex;flex-direction:column;gap:4px;max-width:340px;margin:0 auto}
.drow{display:flex;align-items:center;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.drow i{font-style:normal;width:10px;text-align:right}
.bar{background:var(--absent);color:var(--on-color);font-weight:700;padding:2px 8px;text-align:right;min-width:24px;box-sizing:border-box}
.bar.hl{background:var(--correct)}
.today{display:flex;justify-content:center;gap:8px}
.today .pick{cursor:default}
.today .pick.free{cursor:pointer}
.foot{display:flex;align-items:center;gap:16px;margin-top:22px}
.foot .next{flex:1;text-align:center;border-right:1px solid var(--line);padding-right:12px}
.foot .next small{display:block;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.foot .next b{font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.foot .acts{flex:1;display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:24px;height:46px;padding:0 18px;font:700 15px var(--f-ui);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--correct);color:var(--on-color)}
.btn.ghost{background:none;color:var(--fg);border:1px solid var(--line-strong)}
.btn.wa{background:var(--wa);color:var(--on-color);text-decoration:none}
.btn.wa svg{width:20px;height:20px}
.share{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.share .btn{flex:1 1 120px}
.alldone{font-weight:700;text-align:center;font-size:15px}
.result{text-align:center;margin:6px 0 0}
.result .word{display:inline-block;font-weight:800;letter-spacing:.12em;font-size:22px;margin-top:4px}
.copybox{width:100%;height:120px;margin-top:10px;font:14px/1.3 var(--f-ui);background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
</style>
</head>

    <div class="hbtns">
      <button class="icon-btn" id="helpBtn" aria-label="Como jogar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg></button>

</div>
<div id="toasts" aria-live="polite"></div>
<div class="overlay" id="helpModal" hidden></div>

function lisbonParts(){
  const f = new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Lisbon",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  return {y:+p.year,m:+p.month,d:+p.day,h:+p.hour,mi:+p.minute,s:+p.second};
}
function todayNum(){ const p=lisbonParts(); return Math.round((Date.UTC(p.y,p.m-1,p.d)-START)/864e5); }
function solutionFor(day,slot){ const n=SOL.length; const i=(((day*GAMES_PER_DAY+slot)%n)+n)%n; return SOL[i]; }

    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    const ref=db.collection("data/users/"+id).doc("quina");
    const snap=await ref.get();
    dbRef=ref;
    if(snap.exists){
      let remote=null; try{ remote=JSON.parse(snap.data().json); }catch(e){}
      if(remote&&remote.stats&&(remote.updatedAt||0)>(save.updatedAt||0)&&!busy){
        save=remote; ensureDay(); try{ localStorage.setItem(STORE_KEY,JSON.stringify(save)); }catch(e){}
        resetCur(); slot=firstOpenSlot(); renderAll(); return;
      }
    }
    if(save.updatedAt) syncRemote();
  }catch(e){}
}

/* ---------- evaluation ---------- */
function evaluate(guess,answer){
  const g=[...guess], a=[...norm(answer)], res=Array(LEN).fill("absent"), left={};
  for(let i=0;i<LEN;i++){ if(g[i]===a[i]) res[i]="correct"; else left[a[i]]=(left[a[i]]||0)+1; }
  for(let i=0;i<LEN;i++){ if(res[i]!=="correct"&&left[g[i]]>0){ res[i]="present"; left[g[i]]--; } }
  return res;
}

/* ---------- rendering ---------- */
const $=s=>document.querySelector(s);
const board=$("#board"), kb=$("#keyboard"), picker=$("#picker");
const game=()=>save.games[slot];
const answer=()=>solutionFor(day,slot);

function buildBoard(){
  board.innerHTML="";
  for(let r=0;r<ROWS;r++){
    const row=document.createElement("div"); row.className="row"; row.setAttribute("role","row");
    for(let c=0;c<LEN;c++){ const t=document.createElement("div"); t.className="tile"; t.setAttribute("role","gridcell"); row.appendChild(t); }
    board.appendChild(row);
  }
}
function renderBoard(){
  const g=game(), ans=answer();
  [...board.children].forEach((row,r)=>{
    const tiles=[...row.children];
    if(r<g.guesses.length){
      const n=g.guesses[r], shown=[...display(n)], ev=evaluate(n,ans);
      tiles.forEach((t,i)=>{ t.className="tile "+ev[i]; t.textContent=shown[i]; });
    }else if(r===g.guesses.length&&g.status==="playing"){
      tiles.forEach((t,i)=>{ const ch=cur[i]||""; t.className="tile active"+(ch?" filled":"")+(i===pos&&!busy?" cursor":""); t.textContent=ch; t.dataset.i=i; });
    }else tiles.forEach(t=>{ t.className="tile"; t.textContent=""; });
  });
}
const KEYS=[["Q","E","R","T","U","I","O","P"],["A","S","D","F","G","H","J","L"],["ENTER","Z","X","C","V","B","N","M","BACK"]];
function buildKeyboard(){
  kb.innerHTML="";
  KEYS.forEach((r,ri)=>{
    const row=document.createElement("div"); row.className="krow";
    if(ri<2){ const s=document.createElement("div"); s.className="spacer"; row.appendChild(s); }
    r.forEach(k=>{
      const b=document.createElement("button"); b.className="key"; b.dataset.key=k; b.type="button";
      if(k==="ENTER"){ b.classList.add("wide"); b.textContent="Enter"; b.setAttribute("aria-label","Submeter"); }
      else if(k==="BACK"){ b.classList.add("wide"); b.setAttribute("aria-label","Apagar");
        b.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.9.89 1.59.89h15c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H7.07L2.4 12l4.66-7H22v14zm-11.59-2L14 13.41 17.59 17 19 15.59 15.41 12 19 8.41 17.59 7 14 10.59 10.41 7 9 8.41 12.59 12 9 15.59z"/></svg>'; }
      else b.textContent=k;
      b.addEventListener("click",e=>{ e.currentTarget.blur(); press(k); });
      row.appendChild(b);
    });
    if(ri<2){ const s=document.createElement("div"); s.className="spacer"; row.appendChild(s); }
    kb.appendChild(row);
  });
}
function renderKeyboard(upto){
  const g=game(), ans=answer(), rank={absent:1,present:2,correct:3}, st={};
  g.guesses.slice(0,upto??g.guesses.length).forEach(n=>{
    evaluate(n,ans).forEach((v,i)=>{ const l=n[i]; if(!st[l]||rank[v]>rank[st[l]]) st[l]=v; });
  });
  kb.querySelectorAll(".key").forEach(b=>{ const k=b.dataset.key; b.classList.remove("correct","present","absent"); if(st[k]) b.classList.add(st[k]); });
}
function renderPicker(){
  picker.innerHTML='<span class="lbl">Jogo</span>';
  save.games.forEach((g,i)=>{
    const b=document.createElement("button"); b.className="pick"; b.type="button"; b.textContent=i+1;
    if(g.status!=="playing") b.classList.add(g.status);
    if(i===slot) b.classList.add("on");
    b.setAttribute("aria-label",`Jogo ${i+1}`+(g.status==="won"?", ganho":g.status==="lost"?", perdido":""));
    b.addEventListener("click",()=>{ if(busy) return; slot=i; resetCur(); renderAll(); b.blur(); });
    picker.appendChild(b);
  });
}
function renderAll(){ renderPicker(); renderBoard(); renderKeyboard(); }

function fit(){
  const wrap=$("#boardWrap"), h=wrap.clientHeight-16, w=wrap.clientWidth;
  const bw=Math.max(150,Math.min(350,w,h/1.2));
  document.documentElement.style.setProperty("--bw",bw+"px");
}

/* ---------- toasts & modals ---------- */
function toast(msg,ms=1400){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; $("#toasts").appendChild(t);
  if(ms>0) setTimeout(()=>{ t.style.opacity="0"; setTimeout(()=>t.remove(),300); },ms);
}
function openModal(el){ el.hidden=false; const c=el.querySelector(".close"); if(c) c.focus(); }
function closeModals(){ document.querySelectorAll(".overlay").forEach(o=>o.hidden=true); clearInterval(timer); }
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{ if(e.target===o) closeModals(); }));
const closeBtn='<button class="icon-btn close" aria-label="Fechar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>';
function exRow(word,idx,cls){ return '<div class="ex">'+[...word].map((l,i)=>`<div class="tile ${i===idx?cls:"plain"}">${l}</div>`).join("")+"</div>"; }

function showHelp(){
  const m=$("#helpModal");
  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="hT">${closeBtn}
  <h2 id="hT">Como jogar</h2>
  <p>Adivinha a palavra em 6 tentativas.</p>
  <ul><li>Cada tentativa tem de ser uma palavra válida de 5 letras.</li>
  <li>A cor das peças mostra se estiveste perto.</li>
  <li>Toca num quadrado da linha para escrever nessa posição. Assim podes pôr primeiro as letras que já sabes.</li></ul>
  <p><b>Exemplos</b></p>
  ${exRow("PRAIA",0,"correct")}<p><b>P</b> está na palavra e no sítio certo.</p>
  ${exRow("LIVRO",1,"present")}<p><b>I</b> está na palavra, mas noutro sítio.</p>
  ${exRow("CAMPO",3,"absent")}<p><b>P</b> não está na palavra.</p>
  <p>Não precisas de escrever acentos nem cedilha: escreve <b>CORACAO</b> e o jogo mostra <b>CORAÇÃO</b>. As letras K, W e Y não entram.</p>
  <p>Há <b>5 palavras novas por dia</b>, iguais para toda a gente. Mudam à meia-noite (hora de Lisboa).</p></div>`;
  m.querySelector(".close").onclick=closeModals; openModal(m);
}

let timer=null;
function countdown(){
  const p=lisbonParts(); let s=86400-(p.h*3600+p.mi*60+p.s); if(s<0) s=0;
  const pad=n=>String(n).padStart(2,"0");
  return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`;
}
function siteUrl(){
  try{ if(/^https?:$/.test(location.protocol)&&!/claude/i.test(location.hostname)) return location.origin+location.pathname; }catch(e){}
  return "";
}
function dayText(){
  const sq={correct:"🟩",present:"🟨",absent:"⬛"};
  const done=save.games.map((g,i)=>({g,i})).filter(x=>x.g.status!=="playing");
  const won=done.filter(x=>x.g.status==="won").length;
  let txt=`Palavrle #${day+1} · ${won}/${done.length} ${done.length===1?"ganho":"ganhos"}`;
  done.forEach(({g,i})=>{
    const ans=solutionFor(day,i), score=g.status==="won"?g.guesses.length:"X";
    txt+=`\n\nJogo ${i+1} · ${score}/6\n`+g.guesses.map(n=>evaluate(n,ans).map(v=>sq[v]).join("")).join("\n");
  });
  const u=siteUrl(); if(u) txt+=`\n\n${u}`;
  return txt;
}
function showCopyBox(txt){
  let box=$("#copyBox");
  if(!box){ box=document.createElement("textarea"); box.className="copybox"; box.id="copyBox"; box.readOnly=true; $("#statsModal .modal").appendChild(box); }
  box.value=txt; box.focus(); box.select();
  toast("Seleciona e copia o texto");
}
async function copyResults(){
  const txt=dayText();
  try{ await navigator.clipboard.writeText(txt); toast("Resultados copiados"); }
  catch(e){ showCopyBox(txt); }
}
async function systemShare(){
  const txt=dayText();
  try{ await navigator.share({text:txt}); }
  catch(e){ if(e&&e.name==="AbortError") return; copyResults(); }
}
function firstOpenSlot(){ const i=save.games.findIndex(g=>g.status==="playing"); return i<0?slot:i; }

function showStats(){
  const m=$("#statsModal"), s=save.stats, g=game(), done=g.status!=="playing";
  const pct=s.played?Math.round(100*s.wins/s.played):0, max=Math.max(1,...s.dist);
  const hl=g.status==="won"?g.guesses.length-1:-1;
  const nextOpen=save.games.findIndex(x=>x.status==="playing");
  let result="";
  if(done){
    result=`<div class="result">${g.status==="won"?`Acertaste o jogo ${slot+1} em ${g.guesses.length} ${g.guesses.length===1?"tentativa":"tentativas"}.`:`A palavra do jogo ${slot+1} era`}<br><span class="word">${answer()}</span></div>`;
  }
  const todayPicks=save.games.map((x,i)=>`<button type="button" class="pick ${x.status!=="playing"?x.status:"free"}" data-go="${i}" aria-label="Jogo ${i+1}">${i+1}</button>`).join("");
  const playedToday=save.games.filter(x=>x.status!=="playing").length, wonToday=save.games.filter(x=>x.status==="won").length;
  m.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="sT">${closeBtn}
    <h3 id="sT">Estatísticas</h3>
    <div class="statrow">
      <div class="stat"><b>${s.played}</b><span>Jogados</span></div>
      <div class="stat"><b>${pct}</b><span>% Vitórias</span></div>
      <div class="stat"><b>${s.curWin}</b><span>Vitórias seguidas</span></div>
      <div class="stat"><b>${s.maxWin}</b><span>Melhor série</span></div>
      <div class="stat"><b>${s.dayStreak}</b><span>Dias seguidos</span></div>
    </div>
    <h3>Distribuição de tentativas</h3>
    <div class="dist">${s.dist.map((v,i)=>`<div class="drow"><i>${i+1}</i><div class="bar${i===hl?" hl":""}" style="width:${Math.max(7,Math.round(100*v/max))}%">${v}</div></div>`).join("")}</div>
    <h3>Hoje · ${playedToday}/5 jogados, ${wonToday} ganhos</h3>
    <div class="today">${todayPicks}</div>
    ${result}
    <div class="foot">
      <div class="next"><small>Novas palavras em</small><b id="cd">${countdown()}</b></div>
      <div class="acts">
        ${nextOpen>=0?`<button class="btn primary" id="nextBtn" type="button">Jogo ${nextOpen+1} →</button>`:`<span class="alldone">Jogaste os 5 de hoje!</span>`}
      </div>
    </div>
    ${playedToday?`<h3>Enviar os resultados de hoje</h3>
    <div class="share">
      <a class="btn wa" id="waBtn" href="https://wa.me/?text=${encodeURIComponent(dayText())}" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18a8 8 0 0 1-4.1-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8 8 0 1 1 12 20zm4.4-6c-.2-.1-1.4-.7-1.6-.8s-.4-.1-.5.1l-.7.9c-.1.2-.3.2-.5.1a6.5 6.5 0 0 1-3.2-2.8c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.7-1.7c-.2-.5-.4-.4-.5-.4h-.5a.9.9 0 0 0-.7.3 2.8 2.8 0 0 0-.9 2.1 4.9 4.9 0 0 0 1 2.6 11.2 11.2 0 0 0 4.3 3.8c1.6.7 2.2.7 3 .6a2.6 2.6 0 0 0 1.7-1.2 2.1 2.1 0 0 0 .1-1.2c0-.1-.2-.2-.4-.3z"/></svg>
        WhatsApp</a>
      <button class="btn ghost" id="copyBtn" type="button">Copiar</button>
      ${navigator.share?`<button class="btn ghost" id="moreBtn" type="button">Outras apps</button>`:""}
    </div>`:""}
    <p class="note">As estatísticas ficam guardadas neste dispositivo.</p></div>`;
  m.querySelector(".close").onclick=closeModals;
  m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ slot=+b.dataset.go; resetCur(); closeModals(); renderAll(); });
  const nb=m.querySelector("#nextBtn"); if(nb) nb.onclick=()=>{ slot=nextOpen; resetCur(); closeModals(); renderAll(); };
  const cb=m.querySelector("#copyBtn"); if(cb) cb.onclick=copyResults;
  const mb=m.querySelector("#moreBtn"); if(mb) mb.onclick=systemShare;
  clearInterval(timer); timer=setInterval(()=>{ const c=$("#cd"); if(c) c.textContent=countdown(); if(todayNum()!==day) location.reload(); },1000);
  openModal(m);
}

/* ---------- input ---------- */
function rowEl(){ return board.children[game().guesses.length]; }
function shake(){ const r=rowEl(); r.classList.remove("shake"); void r.offsetWidth; r.classList.add("shake"); setTimeout(()=>r.classList.remove("shake"),520); }
const reduced=()=>matchMedia("(prefers-reduced-motion: reduce)").matches;

function press(k){
  if(busy||!$("#helpModal").hidden||!$("#statsModal").hidden) return;
  const g=game(); if(g.status!=="playing") return;
  if(todayNum()!==day){ location.reload(); return; }
  if(k==="BACK"){ if(cur[pos]) cur[pos]=""; else if(pos>0){ pos--; cur[pos]=""; } renderBoard(); return; }
  if(k==="LEFT"){ if(pos>0) pos--; renderBoard(); return; }
  if(k==="RIGHT"){ if(pos<LEN-1) pos++; renderBoard(); return; }
  if(k==="ENTER"){ submit(); return; }
  if(/^[A-Z]$/.test(k)&&!"KWY".includes(k)){
    cur[pos]=k;
    let nx=-1; for(let i=pos+1;i<LEN;i++) if(!cur[i]){ nx=i; break; }
    pos = nx>=0 ? nx : Math.min(pos+1,LEN-1);
    renderBoard();
  }
}
function submit(){
  const g=game();
  if(cur.some(c=>!c)){ toast("Faltam letras"); shake(); return; }
  const word=cur.join("");
  if(!DICT.has(word)){ toast("Palavra não aceite"); shake(); return; }
  const n=word, ans=answer(), ev=evaluate(n,ans), shown=[...display(n)], r=g.guesses.length, tiles=[...board.children[r].children];
  g.guesses.push(n); resetCur();
  const won=n===norm(ans), lost=!won&&g.guesses.length===ROWS;
  if(won||lost) finishGame(won);
  persist();
  busy=true;
  const step=reduced()?0:300;
  tiles.forEach((t,i)=>{
    setTimeout(()=>{
      if(!step){ t.className="tile "+ev[i]; t.textContent=shown[i]; return; }
      t.classList.add("flip-in");
      setTimeout(()=>{ t.className="tile flip-out "+ev[i]; t.textContent=shown[i]; },250);
    },i*step);
  });
  setTimeout(()=>{
    busy=false; renderPicker(); renderKeyboard(); if(!won&&!lost) renderBoard();
    if(won){
      const msgs=["Génio!","Magnífico!","Impressionante!","Esplêndido!","Boa!","Ufa!"];
      toast(msgs[g.guesses.length-1],1800);
      if(!reduced()) tiles.forEach((t,i)=>setTimeout(()=>t.classList.add("bounce"),i*100));
      setTimeout(showStats,1900);
    }else if(lost){
      toast(display(norm(ans)),2200); setTimeout(showStats,2300);
    }
  },LEN*step+(step?300:0));
}
function finishGame(won){
  const g=game(), s=save.stats; g.status=won?"won":"lost";
  save.history=save.history||{}; save.history[day]=save.games;
  s.played++;
  if(won){ s.wins++; s.dist[g.guesses.length-1]++; s.curWin++; s.maxWin=Math.max(s.maxWin,s.curWin); }
  else s.curWin=0;
  if(s.lastDay!==day){ s.dayStreak=(s.lastDay===day-1)?s.dayStreak+1:1; s.lastDay=day; s.maxDayStreak=Math.max(s.maxDayStreak,s.dayStreak); }
}
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){ closeModals(); return; }
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.target&&e.target.tagName==="TEXTAREA") return;
  if(e.key==="Enter"){ if(document.activeElement&&document.activeElement.tagName==="BUTTON"&&document.activeElement.closest(".overlay,#picker,header")) return; e.preventDefault(); press("ENTER"); return; }
  if(e.key==="Backspace"||e.key==="Delete"){ e.preventDefault(); press("BACK"); return; }
  if(e.key==="ArrowLeft"){ e.preventDefault(); press("LEFT"); return; }
  if(e.key==="ArrowRight"){ e.preventDefault(); press("RIGHT"); return; }
  if(e.key.length===1){ const k=norm(e.key); if(/^[A-Z]$/.test(k)) press(k); }
});
board.addEventListener("click",e=>{
  const t=e.target.closest(".tile.active"); if(!t||busy||game().status!=="playing") return;
  pos=+t.dataset.i; renderBoard();
});
$("#helpBtn").onclick=showHelp;
$("#statsBtn").onclick=showStats;

/* ---------- boot ---------- */
loadLocal(); ensureDay();
slot=firstOpenSlot();
buildBoard(); buildKeyboard(); renderAll(); fit();
addEventListener("resize",fit);
let firstVisit=false; try{ firstVisit=!localStorage.getItem(STORE_KEY+"-seen"); localStorage.setItem(STORE_KEY+"-seen","1"); }catch(e){}
if(firstVisit&&!save.stats.played) showHelp();
connectRemote();
</script>

</body>
